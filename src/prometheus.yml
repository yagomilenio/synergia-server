# prometheus.yml
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "rest_api"
    static_configs:
      - targets: ["rest_api:8000"]

  - job_name: "ws_api"
    static_configs:
      - targets: ["ws_api:8001"]

  - job_name: "rabbitmq"
    metrics_path: /metrics/detailed
    params:
      family: ['queue_coarse_metrics']
    static_configs:
      - targets: ["rabbitmq:15692"]
